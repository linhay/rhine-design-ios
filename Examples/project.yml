name: RhineExample
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
packages:
  RhineDesign:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  RhineExample:
    type: application
    platform: iOS
    sources: [RhineExample]
    dependencies:
      - package: RhineDesign
        product: RhineDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.linhay.rhinedesign.example
        INFOPLIST_KEY_CFBundleDisplayName: Rhine Gallery
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  RhineDesignTests:
    type: bundle.unit-test
    platform: iOS
    sources: [../Tests/RhineDesignTests, RhineExampleModelTests]
    dependencies:
      - target: RhineExample
      - package: RhineDesign
        product: RhineDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.linhay.rhinedesign.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RhineExample.app/RhineExample"
        BUNDLE_LOADER: "$(TEST_HOST)"
  RhineExampleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RhineExampleUITests]
    dependencies:
      - target: RhineExample
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.linhay.rhinedesign.uitests
schemes:
  RhineExample:
    build:
      targets:
        RhineExample: all
        RhineDesignTests: [test]
        RhineExampleUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [RhineDesignTests, RhineExampleUITests]
